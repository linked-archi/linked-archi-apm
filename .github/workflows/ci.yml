# CI validates and archives the committed Agent Skills directly. There is no build step and
# no install-time bundling: the committed tree is the artifact.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every Python the skills claim to support. All six SKILL.md files say "Python 3.11 or
  # newer", so the floor and the current ceiling are both tested - those are the two that
  # break, and testing only the middle would leave the claim unbacked.
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # pyshacl belongs to the validate owner and pulls rdflib. Omitting it does not fail
      # loudly - `la-validate doctor` reports MISSING and 35 tests skip - so CI would report
      # green while never exercising SHACL at all. Install what a real install has.
      - run: pip install --quiet PyYAML pyoxigraph pyshacl
      - run: python --version && ps --version | head -1
      - run: make check
      - run: make verify
      - run: make verify-curated

  # The same suite in a slim container, which is not redundant. A hosted runner has `make`,
  # `git` and `ps` preinstalled; a slim image has none of them, and that difference is
  # load-bearing. The memory watchdog reads /proc/<pid>/statm and falls back to `ps`, so on a
  # runner where `ps` always exists a fault in either reader can hide. This job is where a
  # bound that quietly stops enforcing gets caught.
  slim:
    name: tests (slim container, no preinstalled tooling)
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: system packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends make git procps
      - run: pip install --quiet PyYAML pyoxigraph pyshacl
      - run: python --version && git --version && ps --version | head -1
      - run: make check

  # Built on every push and pull request, published only from main. --strict turns a broken
  # internal link into a failed build, which is the whole reason the site is built in CI at all:
  # the pages make countable claims about the package, and tests/test_docs.py checks the counts
  # against catalog.json and patterns.json rather than trusting the prose.
  docs:
    name: docs (build, strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: site

  # Deploys the artifact the docs job built. Separate because publishing is the only step here
  # that needs write scope, so it is the only job that gets it - the same split the release job
  # uses. Needs the test job too: a site describing a tree whose suite fails is documentation of
  # something that does not work.
  pages:
    name: pages
    needs: [docs, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  package:
    name: package
    needs: [test, slim]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet PyYAML pyoxigraph pyshacl
      - run: make dist
      - run: ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linked-archi-apm-${{ github.ref_name }}
          path: dist/*.tar.gz
          retention-days: 365
          if-no-files-found: error

  # Tags only. The tag itself is what `apm install ...#<tag>` resolves, so this job is not
  # on the critical path for the documented install route - a consumer is served by the
  # commit the tag points at, whether or not a release exists. It exists because the
  # artifact above is a build receipt rather than a distribution: downloading one needs a
  # login, it has no stable URL, and it expires. A release asset has none of those limits,
  # and the notes give the "what changed" that a bare tag cannot.
  release:
    name: release
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Raised for this job alone; every other job in this file stays read-only. Publishing
    # is the only step here that needs to write, so it is the only scope that gets to.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with the manifest would publish a release named after one
      # version carrying the notes and tarball of another. Cheaper to refuse than to
      # retract, since a fetched tag cannot be recalled.
      - name: tag agrees with the manifest version
        run: |
          declared="v$(make -s version)"
          if [ "$declared" != "${{ github.ref_name }}" ]; then
            echo "REFUSED: tag ${{ github.ref_name }} but apm.yml declares $declared" >&2
            exit 1
          fi
          echo "  $declared"
      # The same command a maintainer runs before tagging, so what CI publishes is what
      # they already read. A missing CHANGELOG section fails here rather than shipping an
      # empty release body.
      - run: make -s release-notes | tee release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: linked-archi-apm-${{ github.ref_name }}
          path: dist
      # --verify-tag refuses to invent a tag if the ref ever disappears underneath us.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.tar.gz \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --verify-tag
