# Documentation site for linked-archi-apm.
#
# Built with --strict in CI, so a broken internal link fails the build rather than shipping.
# The content rule for this site: every command shown was run against the bundled fixtures,
# and every count, message and field order is copied from a real result or from the source.
# Nothing here is illustrative-but-untrue.
site_name: Linked.Archi APM
site_description: >-
  Six Agent Skills that let an AI agent answer architecture questions from an RDF knowledge
  graph, with the query, the dataset and the profile attached to every answer.
site_url: https://linked-archi.github.io/linked-archi-apm/
repo_url: https://github.com/linked-archi/linked-archi-apm
repo_name: linked-archi/linked-archi-apm
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Concepts:
      - The graph profile: concepts/profile.md
      - Evidence and refusal: concepts/evidence.md
  - Skills:
      - linked-archi-source: skills/source.md
      - linked-archi-connect: skills/connect.md
      - linked-archi-profile: skills/profile.md
      - linked-archi-query: skills/query.md
      - linked-archi-validate: skills/validate.md
      - linked-archi-analyse: skills/analyse.md
  - Template catalogue: templates.md
  - Analysis patterns: patterns.md
  - Conversational analysis: walkthrough.md
  - Reference:
      - CLI: reference/cli.md
      - Exit codes: reference/exit-codes.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/linked-archi/linked-archi-apm
