# Deprecated: the same as linked-archi-default.
#
# This profile described output written with --emit-direct-rel-triples. The converters now
# write the direct triples by default, and linked-archi-default claims them, so this adds
# nothing. It stays so that a command or a profile naming it still resolves, and will be
# removed in a later release. Name linked-archi-default instead; linked-archi-qualified
# describes output without the direct triples.
extends: linked-archi-default.yaml

profile: linked-archi-direct
version: 2
description: >-
  Deprecated - the same as linked-archi-default, which now describes the direct triples
  the converters write by default. Name linked-archi-default instead.
