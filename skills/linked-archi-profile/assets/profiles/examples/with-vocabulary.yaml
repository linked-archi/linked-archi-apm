# Converter output with published vocabulary attached beside it.
#
# The converters emit instances, never the ontologies and taxonomies those instances
# conform to. So a dataset on its own cannot answer anything that needs the schema: which
# classes are activities, what category a type belongs to, which unqualified predicate a
# relationship class stands for. A template facing that gap has one option left, which is
# to enumerate types by hand - and notation/bpmn/process-components does exactly that,
# with a list covering 17 of the 49 element classes its ontology declares.
#
# This profile is the other option. `la-connect` accepts several files, so the vocabulary
# is paired with the data at query time:
#
#   la-connect connect --data graph/merged/merged-graph.trig --data bpmn-tax.ttl
#
# Query time rather than conversion time, deliberately. Baking the ontology into every
# export couples each artifact to a vocabulary version it must then be kept in step with,
# and the export is the thing most likely to be copied, cached and re-published. Pairing at
# query time keeps that coupling explicit and per-session - at the cost of making the
# operator responsible for pairing the RIGHT version, which is what `verify` is for.
extends: ../linked-archi-default.yaml

profile: with-vocabulary
version: 1
description: >-
  Converter output plus the published ontologies and taxonomies, paired as Turtle beside
  it, so schema-level questions become answerable without changing the export.

graphs:
  roles:
    # `default`, not a suffix, and that is not a shortcut. A published ontology, taxonomy
    # or shape set is a Turtle document with no graph in it - `meta.linked.archi` serves
    # every one of them as `text/turtle` - and `la-connect` loads a Turtle file into the
    # default graph. Binding a suffix here asks for a named graph the artifact does not
    # have, so every template reading it returns nothing: measured at five rows against
    # zero on identical triples, with no error in either direction.
    #
    # Isolation still holds, which was the reason for wanting a separate graph. Instance
    # templates scope to `semantic`, so a class carrying `skos:prefLabel "Task"` cannot
    # come back as a candidate from `core/resolve-element` - verified, not assumed.
    #
    # The exception is `layout: single`, where instances are flattened into the default
    # graph too and share it with the schema. Flattening gives up the separation; nothing
    # here can recover it.
    vocabulary: default

# ---------------------------------------------------------------------------
# What this does NOT claim
# ---------------------------------------------------------------------------
# Loading the ontology gives you its AXIOMS, not entailment. `?e a bpmn:Task` still does
# not match a `bpmn:UserTask` instance: a query has to walk `rdfs:subClassOf*` itself, and
# the templates that do say so. Materialising supertypes onto instances instead would make
# every type count in core/inventory mean something else, and would inflate every
# concatenated types column, so it is deliberately not the route here.
#
# Nor does attaching vocabulary make the data conform to it. That is a SHACL question, and
# `linked-archi-validate` answers it against shapes - which can be attached the same way.
